<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="circleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecfdf5" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#d1fae5" stop-opacity="0.3" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#059669" flood-opacity="0.18" />
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur" />
    </filter>
  </defs>

  <!-- Ambient Glow Background -->
  <circle cx="300" cy="250" r="180" fill="#a7f3d0" opacity="0.35" filter="url(#softGlow)" />
  <circle cx="380" cy="180" r="110" fill="#6ee7b7" opacity="0.25" filter="url(#softGlow)" />

  <!-- Base Decorative Rings -->
  <circle cx="300" cy="250" r="190" fill="url(#circleGrad)" stroke="#a7f3d0" stroke-width="1.5" stroke-dasharray="8 6" />
  <circle cx="300" cy="250" r="150" fill="none" stroke="#6ee7b7" stroke-width="1" opacity="0.6" />

  <!-- Center Floating Plate -->
  <circle cx="300" cy="250" r="120" fill="#ffffff" filter="url(#cardShadow)" />

  <!-- Modern Recycling Loop Icon -->
  <g transform="translate(300, 250) scale(1.15)">
    <!-- Arrow 1 (Top Right) -->
    <path d="M-15 -65 C15 -65, 55 -35, 60 -5 L50 -8 M60 -5 L68 -18" 
          fill="none" stroke="url(#primaryGrad)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
    <polygon points="62,5 74,-15 52,-12" fill="url(#primaryGrad)" />

    <!-- Arrow 2 (Bottom) -->
    <path d="M55 25 C45 60, 5 70, -25 65 L-20 54 M-25 65 L-16 75" 
          fill="none" stroke="url(#primaryGrad)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
    <polygon points="-36,65 -18,78 -18,54" fill="url(#primaryGrad)" />

    <!-- Arrow 3 (Top Left) -->
    <path d="M-40 40 C-65 15, -60 -25, -35 -50 L-32 -38 M-35 -50 L-46 -45" 
          fill="none" stroke="url(#primaryGrad)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
    <polygon points="-26,-58 -48,-48 -38,-36" fill="url(#primaryGrad)" />

    <!-- Central Leaf -->
    <path d="M0 15 C-25 -10, -10 -40, 15 -35 C20 -5, 10 15, 0 15 Z" fill="url(#accentGrad)" opacity="0.95" />
    <path d="M-4 -2 C2 -12, 8 -22, 12 -30" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.7" />
  </g>

  <!-- Floating Floating Badge 1: AI Analysis -->
  <g transform="translate(100, 110)" filter="url(#cardShadow)">
    <rect width="180" height="54" rx="27" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <circle cx="28" cy="27" r="17" fill="#ecfdf5" />
    <text x="28" y="32" text-anchor="middle" font-size="16">🤖</text>
    <text x="56" y="25" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#0f172a">IA Analyse</text>
    <text x="56" y="41" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="11" fill="#059669">Précision 98%</text>
  </g>

  <!-- Floating Badge 2: Eco Impact -->
  <g transform="translate(350, 80)" filter="url(#cardShadow)">
    <rect width="170" height="54" rx="27" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <circle cx="28" cy="27" r="17" fill="#ecfdf5" />
    <text x="28" y="32" text-anchor="middle" font-size="16">🌱</text>
    <text x="56" y="25" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#0f172a">Éco Impact</text>
    <text x="56" y="41" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="11" fill="#10b981">+350 kg réutilisés</text>
  </g>

  <!-- Floating Badge 3: Creative Projects -->
  <g transform="translate(330, 360)" filter="url(#cardShadow)">
    <rect width="190" height="54" rx="27" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <circle cx="28" cy="27" r="17" fill="#fef3c7" />
    <text x="28" y="32" text-anchor="middle" font-size="16">🛠️</text>
    <text x="56" y="25" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#0f172a">Projets DIY</text>
    <text x="56" y="41" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="11" fill="#d97706">100% Personnalisés</text>
  </g>

  <!-- Decorative Sparkles -->
  <g fill="#10b981" opacity="0.7">
    <circle cx="160" cy="280" r="4" />
    <circle cx="460" cy="210" r="5" />
    <circle cx="230" cy="400" r="3" />
    <circle cx="390" cy="450" r="4" />
    <polygon points="190,190 193,197 200,200 193,203 190,210 187,203 180,200 187,197" fill="#34d399" />
    <polygon points="430,310 432,315 437,317 432,319 430,324 428,319 423,317 428,315" fill="#10b981" />
  </g>
</svg>
